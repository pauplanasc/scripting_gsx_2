# Nginx es el unico servicio expuesto al exterior (NodePort). Por tanto:
# - INGRESS: aceptamos trafico desde cualquier origen al puerto 8080.
# - EGRESS: solo permitimos hablar con el backend en el mismo namespace.

# 1) Ingress externo a nginx (8080)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nginx-allow-external-ingress
spec:
  podSelector:
    matchLabels:
      app: nginx
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
      # Sin clausula 'from' = se acepta desde cualquier origen.
      # Esto cubre el trafico que entra via NodePort/LoadBalancer.

---
# 2) Egress de nginx hacia backend (3000), nada mas
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nginx-egress-to-backend
spec:
  podSelector:
    matchLabels:
      app: nginx
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 3000
